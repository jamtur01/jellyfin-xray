name: Build plugin

on:
  push:
    branches: [main]
    tags: ["*.*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build client bundle
        working-directory: Jellyfin.Plugin.Xray
        run: |
          npm ci
          npm run build
          npm test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run .NET tests
        run: dotnet test --configuration Release

      - name: Build plugin package
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        id: jprm
        with:
          dotnet-target: "net9.0"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: ${{ steps.jprm.outputs.artifact }}

      - name: Create release and attach package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jprm.outputs.artifact }}
          generate_release_notes: true

      - name: Update repository manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        run: |
          set -euo pipefail
          FILENAME="$(basename "$ARTIFACT")"
          VERSION="$(echo "$FILENAME" | sed -E 's/.*_([0-9.]+)\.zip$/\1/')"
          ABI="$(sed -nE 's/^targetAbi:[[:space:]]*"?([0-9.]+)"?.*/\1/p' build.yaml)"
          CHECKSUM="$(md5sum "$ARTIFACT" | cut -d' ' -f1)"
          SOURCEURL="https://github.com/${REPO}/releases/download/${TAG}/${FILENAME}"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ENTRY="$(jq -n --arg v "$VERSION" --arg abi "$ABI" --arg url "$SOURCEURL" --arg cs "$CHECKSUM" --arg ts "$TS" \
            '{version:$v, targetAbi:$abi, sourceUrl:$url, checksum:$cs, timestamp:$ts, changelog:("Release " + $v)}')"
          git fetch origin main
          git checkout -B main origin/main
          jq --argjson e "$ENTRY" '.[0].versions = ([$e] + (.[0].versions // [] | map(select(.version != $e.version))))' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for ${TAG} [skip ci]" || { echo "no manifest changes"; exit 0; }
          git push origin main
