changelog: >
  ### 1.0.2.0
  - Fix the X-Ray button doing nothing on the experimental web client: the playback
    route has no item id in the URL, so resolve the now-playing item from the
    session API as a fallback.
  ### 1.0.1.1
  - Bump esbuild to 0.28.1 (development dependency); no functional changes.
  ### 1.0.1.0
  - Redesigned the cast overlay: glass cards, gold accent on character names,
    staggered card reveal, refined header with cast count, and hover states.
  ### 1.0.0.1
  - Update development dependencies (vitest 4, esbuild 0.28, jsdom 29); no functional changes.
  ### 1.0.0.0
  - Initial release.
